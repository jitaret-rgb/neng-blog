{{- /* Article Schema for SEO */ -}}
{{- if .IsPage -}}
{{- /* รูป: ใช้ helper/social-image จุดเดียวกับ og:image และ twitter:image
       (คืน absolute URL ที่ชี้รูปจริงเสมอ ไฟล์หาย → default-cover ไม่มีทาง404) */ -}}
{{- $social := partial "helper/social-image" . -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ partial "helper/no-emoji" .Title | jsonify | safeJS }},
  "description": {{ .Description | default .Site.Params.description | jsonify | safeJS }},
  "image": {{ $social.URL | jsonify | safeJS }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "author": {
    "@type": "Person",
    "name": "เหน่ง",
    "url": {{ "/about/" | absURL | jsonify | safeJS }}
  },
  "publisher": {
    "@type": "Organization",
    "name": "Neng Lab",
    "logo": {
      "@type": "ImageObject",
      "url": {{ "images/profile.jpg" | absURL | jsonify | safeJS }}
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify | safeJS }}
  },
  "wordCount": {{ .WordCount }},
  "inLanguage": "th",
  {{- if .Params.tags }}
  "keywords": {{ delimit .Params.tags ", " | jsonify | safeJS }},
  {{- end }}
  "articleSection": {{ if .Params.categories }}{{ index .Params.categories 0 | jsonify | safeJS }}{{ else }}"Blog"{{ end }}
}
</script>
{{- end }}
